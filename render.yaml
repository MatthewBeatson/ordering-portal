services:
  - type: web
    name: ordering-portal-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CIN7_API_BASE_URL
        value: https://inventory.dearsystems.com/ExternalApi
      - key: CIN7_ACCOUNT_ID
        sync: false
      - key: CIN7_APPLICATION_KEY
        sync: false
